<div class="app-layout">
  <!-- Barra lateral responsive (Drawer en mobile / sidebar en desktop) -->
  <app-sidebar 
    [mobileOpen]="mobileSidebarOpen()" 
    (closeMobile)="closeMobileSidebar()">
  </app-sidebar>

  <!-- Contenedor Principal (Header + Contenido Router + Footer) -->
  <div class="app-main-wrapper">
    <app-header (toggleSidebar)="toggleMobileSidebar()"></app-header>

    <main class="app-main-content">
      <router-outlet></router-outlet>
    </main>

    <app-footer></app-footer>
  </div>

  <!-- Barra de Navegación Inferior (Tabs fijas en Mobile) -->
  <app-bottom-tabs></app-bottom-tabs>
</div>
