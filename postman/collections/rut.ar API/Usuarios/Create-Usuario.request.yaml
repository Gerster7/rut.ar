$kind: http-request
name: 'Create Usuario'
method: POST
url: '{{baseUrl}}/api/usuarios'
order: 3000
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{token}}'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "email": "nuevo@example.com",
      "password": "password123",
      "rol": "operador"
    }
