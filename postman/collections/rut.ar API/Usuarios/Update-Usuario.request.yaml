$kind: http-request
name: 'Update Usuario'
method: PUT
url: '{{baseUrl}}/api/usuarios/{{usuarioId}}'
order: 4000
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{token}}'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "email": "actualizado@example.com",
      "rol": "admin"
    }
