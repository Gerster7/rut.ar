$kind: http-request
name: 'Update Negocio'
method: PUT
url: '{{baseUrl}}/api/negocios/{{negocioId}}'
order: 4000
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{token}}'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "descripcion": "Carga actualizada",
      "estado": "en_proceso"
    }
