$kind: http-request
name: 'Asignar Fletero a Negocio'
method: POST
url: '{{baseUrl}}/api/negocios/{{negocioId}}/asignar-fletero'
order: 2000
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{token}}'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "fleteroId": 1
    }
