$kind: http-request
name: Login
method: POST
url: "{{baseUrl}}/api/usuarios/login"
scripts:
  - type: afterResponse
    code: "var jsonData = pm.response.json();\r

      \          if (jsonData.token) {\r

      \              pm.collectionVariables.set(\"token\", jsonData.token);\r

      \              console.log(\"Token guardado en collectionVariables\");\r

      \          }"
    language: text/javascript
order: 1000
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "pablo@grillo.com",
      "password": "Prueba123"
    }
